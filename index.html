<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>Análise de Jogo v2</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#eef1f5;color:#15202b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#101820;color:#fff;padding:14px 12px;text-align:center}h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.7;margin:2px 0 6px}#clock{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums}.period{font-size:14px;font-weight:900;margin:4px 0}.status{font-size:13px;min-height:18px}.top{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}button{border:0;border-radius:12px;font-weight:800;min-height:44px;font-size:14px;touch-action:manipulation}.home{background:#159957;color:#fff}.away{background:#d64545;color:#fff}.neutral{background:#e5e9ee;color:#17202a}main{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 2px 10px #0001}.score{display:grid;grid-template-columns:1fr 72px 1fr;align-items:center;gap:8px;text-align:center}.scoreTeam{font-weight:900}.goals{font-size:30px;font-weight:900}.goalBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.possession{display:grid;grid-template-columns:1fr 1fr;gap:8px}.posbox{text-align:center;background:#f5f7f9;border-radius:12px;padding:9px}.pct{font-size:27px;font-weight:900}.time{font-size:12px;color:#687585}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.title{text-align:center;font-size:16px;font-weight:900;margin-bottom:7px}.stat{display:grid;grid-template-columns:1fr 52px;align-items:center;border-top:1px solid #edf0f2;padding:7px 0}.stat:first-child{border-top:0}.name{font-size:13px}.plus{font-size:20px;background:#e9eef3}.count{text-align:center;grid-column:2;font-size:11px;color:#697586}.breakdown{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:12px;text-align:center}.breakdown div{background:#f5f7f9;padding:8px;border-radius:10px}.report{font-size:13px;line-height:1.7}@media(max-width:430px){.name{font-size:12px}.title{font-size:15px}}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:99;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:18px;padding:18px;max-width:700px;width:100%;max-height:90vh;overflow:auto}.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.modalactions button{background:#e5e9ee;color:#17202a}.modalactions .ok{background:#159957;color:#fff}
</style></head><body><header><h1>⚽ ANÁLISE DE JOGO</h1><div class="sub">Versão 2 • 1.ª / 2.ª parte</div><div id="clock">00:00</div><div id="period" class="period">1.ª PARTE</div><div id="status">Cronómetro parado</div><div class="top"><button id="homePoss" class="home">🟢 NOSSA POSSE</button><button id="awayPoss" class="away">🔴 ADVERSÁRIO</button><button id="start" class="neutral">▶️ Iniciar / Parar</button><button id="periodBtn" class="neutral">⏭️ 2.ª PARTE</button><button id="reportBtn" class="neutral">📋 RELATÓRIO</button><button id="newGameBtn" class="neutral">🆕 NOVO JOGO</button><button id="undoBtn" class="neutral">↩️ DESFAZER ÚLTIMA AÇÃO</button></div></header><main><section class="card"><div class="score"><div class="scoreTeam">🔵 Nossa equipa</div><div class="goals"><span id="homeGoals">0</span> - <span id="awayGoals">0</span></div><div class="scoreTeam">🔴 Adversário</div></div><div class="goalBtns"><button id="homeGoal" class="home">⚽ Golo Nossa Equipa</button><button id="awayGoal" class="away">⚽ Golo Adversário</button></div></section><section class="card"><div class="possession"><div class="posbox"><div>Nossa equipa</div><div id="homePct" class="pct">50.0%</div><div id="homeTime" class="time">00:00</div></div><div class="posbox"><div>Adversário</div><div id="awayPct" class="pct">50.0%</div><div id="awayTime" class="time">00:00</div></div></div></section><section class="card"><div class="title">📊 POSSE POR PERÍODO</div><div class="breakdown"><div><b>1.ª PARTE</b><br><span id="p1home">50.0%</span> / <span id="p1away">50.0%</span></div><div><b>2.ª PARTE</b><br><span id="p2home">—</span> / <span id="p2away">—</span></div><div><b>TOTAL</b><br><span id="totalhome">50.0%</span> / <span id="totalaway">50.0%</span></div></div></section><section class="stats"><div class="card"><div class="title">🔵 NOSSA EQUIPA</div><div id="homeStats"></div></div><div class="card"><div class="title">🔴 ADVERSÁRIO</div><div id="awayStats"></div></div></section><section class="card"><div class="title">📋 RESUMO</div><div id="report" class="report"></div></section></main><div id="modal" class="modal"><div class="modalbox"><h2>📋 Relatório do jogo</h2><div id="fullReport" class="report"></div><div class="modalactions"><button id="copyReport" class="ok">📋 Copiar</button><button id="closeReport">Fechar</button></div></div></div><script>
(function(){
"use strict";

const labels=["🎯 Finalizações na baliza","❌ Finalizações fora da baliza","🚩 Cantos","⚠️ Faltas cometidas","🥅 Pontapés de baliza","↗️ Cruzamentos","🚩 Foras de jogo","🟨 Cartões amarelos","🟥 Cartões vermelhos"];
const keys=["shotsOn","shotsOff","corners","fouls","goalKicks","crosses","offsides","yellow","red"];
const $=id=>document.getElementById(id);

let running=false, active=null, last=null, game=0, period=1;
let goals={home:0,away:0};
let possTotal={home:0,away:0};
let possParts=[
 {home:0,away:0},
 {home:0,away:0}
];
let count={home:{},away:{}};
let history=[];
keys.forEach(k=>{count.home[k]=0;count.away[k]=0;});

function fmt(x){
 x=Math.max(0,Math.floor(x));
 return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");
}
function percent(a,b){
 const t=a+b;
 return t?(a/t*100).toFixed(1)+"%":"50.0%";
}
function cloneState(){
 return {
  running:false, active, game, period,
  goals:{...goals},
  possTotal:{...possTotal},
  possParts:[{...possParts[0]},{...possParts[1]}],
  count:{home:{...count.home},away:{...count.away}}
 };
}
function pushHistory(){
 history.push(cloneState());
 if(history.length>100)history.shift();
}
function renderCounts(){
 document.querySelectorAll("[data-stat]").forEach(el=>{
  const team=el.dataset.team, key=el.dataset.stat;
  el.textContent=count[team][key]||0;
 });
}
function restoreState(s){
 running=false;
 active=s.active;
 game=s.game;
 period=s.period;
 goals={...s.goals};
 possTotal={...s.possTotal};
 possParts=[{...s.possParts[0]},{...s.possParts[1]}];
 count={home:{...s.count.home},away:{...s.count.away}};
 last=null;
 renderCounts();
 update();
}
function update(){
 $("clock").textContent=fmt(game);
 $("period").textContent=period===1?"1.ª PARTE":"2.ª PARTE";
 $("homeGoals").textContent=goals.home;
 $("awayGoals").textContent=goals.away;

 $("homePct").textContent=percent(possTotal.home,possTotal.away);
 $("awayPct").textContent=percent(possTotal.away,possTotal.home);
 $("homeTime").textContent=fmt(possTotal.home);
 $("awayTime").textContent=fmt(possTotal.away);

 $("p1home").textContent=percent(possParts[0].home,possParts[0].away);
 $("p1away").textContent=percent(possParts[0].away,possParts[0].home);
 if(period===2){
  $("p2home").textContent=percent(possParts[1].home,possParts[1].away);
  $("p2away").textContent=percent(possParts[1].away,possParts[1].home);
 }else{
  $("p2home").textContent="—"; $("p2away").textContent="—";
 }
 $("totalhome").textContent=percent(possTotal.home,possTotal.away);
 $("totalaway").textContent=percent(possTotal.away,possTotal.home);

 $("report").innerHTML=
  "<b>Resultado:</b> "+goals.home+" - "+goals.away+"<br>"+
  "<b>Posse total:</b> "+percent(possTotal.home,possTotal.away)+" / "+percent(possTotal.away,possTotal.home)+"<br>"+
  "<b>1.ª parte:</b> "+percent(possParts[0].home,possParts[0].away)+" / "+percent(possParts[0].away,possParts[0].home)+"<br>"+
  "<b>2.ª parte:</b> "+(period===2?percent(possParts[1].home,possParts[1].away)+" / "+percent(possParts[1].away,possParts[1].home):"—")+"<br><br>"+
  "<b>Estatísticas — Nossa equipa / Adversário</b><br>"+
  labels.map((l,i)=>l+": "+count.home[keys[i]]+" / "+count.away[keys[i]]).join("<br>");
}
function build(team){
 const box=$(team+"Stats");
 labels.forEach((label,i)=>{
  const key=keys[i];
  const row=document.createElement("div");row.className="stat";
  const name=document.createElement("div");name.className="name";name.textContent=label;
  const btn=document.createElement("button");btn.className="plus";btn.type="button";btn.textContent="+";
  const c=document.createElement("div");c.className="count";c.dataset.team=team;c.dataset.stat=key;c.textContent="0";
  btn.addEventListener("click",()=>{
   pushHistory();
   count[team][key]++;
   update();
  });
  row.append(name,btn,c);box.appendChild(row);
 });
}
function accumulate(now){
 if(last===null){last=now;return;}
 const d=(now-last)/1000;
 game+=d;
 if(active){
  possTotal[active]+=d;
  possParts[period-1][active]+=d;
 }
 last=now;
}
function setPoss(team){
 pushHistory();
 const now=performance.now();
 if(!running){running=true;last=now;}
 else accumulate(now);
 active=team;
 $("status").textContent=team==="home"?"Posse: NOSSA EQUIPA":"Posse: ADVERSÁRIO";
 update();
}
function toggleClock(){
 pushHistory();
 if(running){
  accumulate(performance.now());
  running=false;active=null;last=null;
  $("status").textContent="Cronómetro parado";
 }else{
  running=true;last=performance.now();
  $("status").textContent="Jogo a decorrer";
 }
 update();
}
function secondHalf(){
 if(period===2)return;
 pushHistory();
 if(running)accumulate(performance.now());
 period=2;
 active=null;
 last=running?performance.now():null;
 $("status").textContent="2.ª PARTE";
 update();
}
function undo(){
 if(!history.length){
  $("status").textContent="Nada para desfazer";
  setTimeout(()=>{if(!running)$("status").textContent="Cronómetro parado"},1200);
  return;
 }
 const s=history.pop();
 restoreState(s);
 $("status").textContent="↩️ Última ação desfeita";
 setTimeout(()=>{
  if(running)$("status").textContent=active?(active==="home"?"Posse: NOSSA EQUIPA":"Posse: ADVERSÁRIO"):"Jogo a decorrer";
  else $("status").textContent="Cronómetro parado";
 },1200);
}
function newGame(){
 if(!confirm("Começar um novo jogo? Todas as estatísticas e o resultado atuais serão apagados."))return;
 running=false;active=null;last=null;game=0;period=1;
 goals={home:0,away:0};
 possTotal={home:0,away:0};
 possParts=[{home:0,away:0},{home:0,away:0}];
 count={home:{},away:{}};
 keys.forEach(k=>{count.home[k]=0;count.away[k]=0;});
 history=[];
 renderCounts();
 $("status").textContent="Cronómetro parado";
 update();
}
function reportText(){
 let t="ANÁLISE DE JOGO\n\n";
 t+="Resultado: "+goals.home+" - "+goals.away+"\n";
 t+="\nPOSSE\n";
 t+="1.ª parte: "+percent(possParts[0].home,possParts[0].away)+" / "+percent(possParts[0].away,possParts[0].home)+"\n";
 t+="2.ª parte: "+(period===2?percent(possParts[1].home,possParts[1].away)+" / "+percent(possParts[1].away,possParts[1].home):"não iniciada")+"\n";
 t+="Total: "+percent(possTotal.home,possTotal.away)+" / "+percent(possTotal.away,possTotal.home)+"\n\n";
 t+="ESTATÍSTICAS (Nossa equipa / Adversário)\n";
 labels.forEach((l,i)=>{t+=l+": "+count.home[keys[i]]+" / "+count.away[keys[i]]+"\n";});
 return t;
}
function showReport(){
 alert(reportText());
}
function copyReport(){
 const t=reportText();
 if(navigator.clipboard&&navigator.clipboard.writeText){
  navigator.clipboard.writeText(t).then(()=>alert("Relatório copiado!")).catch(()=>alert(t));
 }else alert(t);
}

$("homePoss").onclick=()=>setPoss("home");
$("awayPoss").onclick=()=>setPoss("away");
$("start").onclick=toggleClock;
$("periodBtn").onclick=secondHalf;
$("undoBtn").onclick=undo;
$("reportBtn").onclick=showReport;
$("copyBtn").onclick=copyReport;
$("newGameBtn").onclick=newGame;
$("resetStatsBtn").onclick=()=>{
 if(!confirm("Zerar apenas as estatísticas? O cronómetro e o resultado serão mantidos."))return;
 pushHistory();
 keys.forEach(k=>{count.home[k]=0;count.away[k]=0;});
 update();
};
$("homeGoal").onclick=()=>{pushHistory();goals.home++;update();};
$("awayGoal").onclick=()=>{pushHistory();goals.away++;update();};

build("home");build("away");update();

function loop(now){
 if(running){accumulate(now);update();}
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script></body></html>
