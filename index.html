<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>Análise de Jogo v2</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#eef1f5;color:#15202b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{background:#101820;color:#fff;padding:14px 12px;text-align:center}h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.7;margin:2px 0 6px}#clock{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums}.period{font-size:14px;font-weight:900;margin:4px 0}.status{font-size:13px;min-height:18px}.top{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}button{border:0;border-radius:12px;font-weight:800;min-height:44px;font-size:14px;touch-action:manipulation}.home{background:#159957;color:#fff}.away{background:#d64545;color:#fff}.neutral{background:#e5e9ee;color:#17202a}main{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 2px 10px #0001}.score{display:grid;grid-template-columns:1fr 72px 1fr;align-items:center;gap:8px;text-align:center}.scoreTeam{font-weight:900}.goals{font-size:30px;font-weight:900}.goalBtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.possession{display:grid;grid-template-columns:1fr 1fr;gap:8px}.posbox{text-align:center;background:#f5f7f9;border-radius:12px;padding:9px}.pct{font-size:27px;font-weight:900}.time{font-size:12px;color:#687585}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.title{text-align:center;font-size:16px;font-weight:900;margin-bottom:7px}.stat{display:grid;grid-template-columns:1fr 52px;align-items:center;border-top:1px solid #edf0f2;padding:7px 0}.stat:first-child{border-top:0}.name{font-size:13px}.plus{font-size:20px;background:#e9eef3}.count{text-align:center;grid-column:2;font-size:11px;color:#697586}.breakdown{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:12px;text-align:center}.breakdown div{background:#f5f7f9;padding:8px;border-radius:10px}.report{font-size:13px;line-height:1.7}@media(max-width:430px){.name{font-size:12px}.title{font-size:15px}}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:99;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:18px;padding:18px;max-width:700px;width:100%;max-height:90vh;overflow:auto}.modalactions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.modalactions button{background:#e5e9ee;color:#17202a}.modalactions .ok{background:#159957;color:#fff}
</style></head><body><header><h1>⚽ ANÁLISE DE JOGO</h1><div class="sub">Versão 2 • 1.ª / 2.ª parte</div><div id="clock">00:00</div><div id="period" class="period">1.ª PARTE</div><div id="status">Cronómetro parado</div><div class="top"><button id="homePoss" class="home">🟢 NOSSA POSSE</button><button id="awayPoss" class="away">🔴 ADVERSÁRIO</button><button id="start" class="neutral">▶️ Iniciar / Parar</button><button id="periodBtn" class="neutral">⏭️ 2.ª PARTE</button><button id="reportBtn" class="neutral">📋 RELATÓRIO</button><button id="newGameBtn" class="neutral">🆕 NOVO JOGO</button></div></header><main><section class="card"><div class="score"><div class="scoreTeam">🔵 Nossa equipa</div><div class="goals"><span id="homeGoals">0</span> - <span id="awayGoals">0</span></div><div class="scoreTeam">🔴 Adversário</div></div><div class="goalBtns"><button id="homeGoal" class="home">⚽ Golo Nossa Equipa</button><button id="awayGoal" class="away">⚽ Golo Adversário</button></div></section><section class="card"><div class="possession"><div class="posbox"><div>Nossa equipa</div><div id="homePct" class="pct">50.0%</div><div id="homeTime" class="time">00:00</div></div><div class="posbox"><div>Adversário</div><div id="awayPct" class="pct">50.0%</div><div id="awayTime" class="time">00:00</div></div></div></section><section class="card"><div class="title">📊 POSSE POR PERÍODO</div><div class="breakdown"><div><b>1.ª PARTE</b><br><span id="p1home">50.0%</span> / <span id="p1away">50.0%</span></div><div><b>2.ª PARTE</b><br><span id="p2home">—</span> / <span id="p2away">—</span></div><div><b>TOTAL</b><br><span id="totalhome">50.0%</span> / <span id="totalaway">50.0%</span></div></div></section><section class="stats"><div class="card"><div class="title">🔵 NOSSA EQUIPA</div><div id="homeStats"></div></div><div class="card"><div class="title">🔴 ADVERSÁRIO</div><div id="awayStats"></div></div></section><section class="card"><div class="title">📋 RESUMO</div><div id="report" class="report"></div></section></main><div id="modal" class="modal"><div class="modalbox"><h2>📋 Relatório do jogo</h2><div id="fullReport" class="report"></div><div class="modalactions"><button id="copyReport" class="ok">📋 Copiar</button><button id="closeReport">Fechar</button></div></div></div><script>
(function(){
const labels=["🎯 Finalizações na baliza","❌ Finalizações fora","🚩 Cantos","⚠️ Faltas cometidas","🥅 Pontapés de baliza","↗️ Cruzamentos","🚩 Foras de jogo","🟨 Cartões amarelos","🟥 Cartões vermelhos"];
const keys=["shotsOn","shotsOff","corners","fouls","goalKicks","crosses","offsides","yellow","red"];
const count={home:{},away:{}}; keys.forEach(k=>{count.home[k]=0;count.away[k]=0});
let running=false,active=null,last=null,game=0,period=1;
let possTotal={home:0,away:0},periodPoss={p1:{home:0,away:0},p2:{home:0,away:0}},goals={home:0,away:0};
const $=id=>document.getElementById(id);
function fmt(x){x=Math.max(0,Math.floor(x));return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function pct(h,a){let t=h+a;return t?(h/t*100).toFixed(1)+"%":"50.0%"}
function save(){try{localStorage.setItem("analiseJogo",JSON.stringify({game,period,possTotal,periodPoss,goals,count}))}catch(e){}}
function load(){try{let d=JSON.parse(localStorage.getItem("analiseJogo"));if(!d)return;game=d.game||0;period=d.period||1;possTotal=d.possTotal||{home:0,away:0};periodPoss=d.periodPoss||{p1:{home:0,away:0},p2:{home:0,away:0}};goals=d.goals||{home:0,away:0};if(d.count)keys.forEach(k=>{count.home[k]=d.count.home?.[k]||0;count.away[k]=d.count.away?.[k]||0})}catch(e){}}
function update(){
 $("clock").textContent=fmt(game);$("period").textContent=period===1?"1.ª PARTE":"2.ª PARTE";
 $("homePct").textContent=pct(possTotal.home,possTotal.away);$("awayPct").textContent=pct(possTotal.away,possTotal.home);
 $("homeTime").textContent=fmt(possTotal.home);$("awayTime").textContent=fmt(possTotal.away);
 $("homeGoals").textContent=goals.home;$("awayGoals").textContent=goals.away;
 $("p1home").textContent=pct(periodPoss.p1.home,periodPoss.p1.away);$("p1away").textContent=pct(periodPoss.p1.away,periodPoss.p1.home);
 $("p2home").textContent=periodPoss.p2.home+periodPoss.p2.away?pct(periodPoss.p2.home,periodPoss.p2.away):"—";$("p2away").textContent=periodPoss.p2.home+periodPoss.p2.away?pct(periodPoss.p2.away,periodPoss.p2.home):"—";
 $("totalhome").textContent=pct(possTotal.home,possTotal.away);$("totalaway").textContent=pct(possTotal.away,possTotal.home);
 $("report").innerHTML="Resultado: <b>"+goals.home+" - "+goals.away+"</b><br>Posse total: <b>"+pct(possTotal.home,possTotal.away)+" / "+pct(possTotal.away,possTotal.home)+"</b>";
 save();
}
function build(team){const box=$(team+"Stats");labels.forEach((label,i)=>{let k=keys[i],r=document.createElement("div");r.className="stat";let n=document.createElement("div");n.className="name";n.textContent=label;let b=document.createElement("button");b.className="plus";b.textContent="+";let c=document.createElement("div");c.className="count";c.id=team+"_"+k;c.textContent="0";b.onclick=()=>{count[team][k]++;c.textContent=count[team][k];save()};r.append(n,b,c);box.appendChild(r)})}
function acc(now){if(last===null){last=now;return}let d=(now-last)/1000;game+=d;if(active){possTotal[active]+=d;periodPoss[period===1?"p1":"p2"][active]+=d}last=now}
function possession(t){let now=performance.now();if(!running){running=true;last=now}else acc(now);active=t;$("status").textContent=t==="home"?"Posse: NOSSA EQUIPA":"Posse: ADVERSÁRIO";update()}
function reportText(){let t="ANÁLISE DE JOGO\n\nResultado: "+goals.home+" - "+goals.away+"\n\n1.ª PARTE\nPosse: "+pct(periodPoss.p1.home,periodPoss.p1.away)+" / "+pct(periodPoss.p1.away,periodPoss.p1.home)+"\n\n2.ª PARTE\nPosse: "+(periodPoss.p2.home+periodPoss.p2.away?pct(periodPoss.p2.home,periodPoss.p2.away)+" / "+pct(periodPoss.p2.away,periodPoss.p2.home):"—")+"\n\nTOTAL\nPosse: "+pct(possTotal.home,possTotal.away)+" / "+pct(possTotal.away,possTotal.home)+"\nTempo de posse: "+fmt(possTotal.home)+" / "+fmt(possTotal.away)+"\n\nESTATÍSTICAS\n";labels.forEach((l,i)=>t+=l+": "+count.home[keys[i]]+" / "+count.away[keys[i]]+"\n");return t}
function showReport(){let t=reportText();$("fullReport").innerHTML=t.replace(/\n/g,"<br>");$("modal").classList.add("show")}
function reset(){if(!confirm("Começar um novo jogo? As estatísticas atuais serão apagadas."))return;running=false;active=null;last=null;game=0;period=1;possTotal={home:0,away:0};periodPoss={p1:{home:0,away:0},p2:{home:0,away:0}};goals={home:0,away:0};keys.forEach(k=>{count.home[k]=0;count.away[k]=0});document.querySelectorAll(".count").forEach(x=>x.textContent="0");$("status").textContent="Cronómetro parado";localStorage.removeItem("analiseJogo");update()}
$("homePoss").onclick=()=>possession("home");$("awayPoss").onclick=()=>possession("away");
$("start").onclick=()=>{if(running){acc(performance.now());running=false;active=null;last=null;$("status").textContent="Cronómetro parado"}else{running=true;last=performance.now();$("status").textContent="Jogo a decorrer"}update()};
$("periodBtn").onclick=()=>{if(period===2)return;if(running)acc(performance.now());running=false;active=null;last=null;period=2;$("status").textContent="2.ª parte — pronto a começar";update()};
$("homeGoal").onclick=()=>{goals.home++;update()};$("awayGoal").onclick=()=>{goals.away++;update()};
$("reportBtn").onclick=showReport;$("closeReport").onclick=()=>$("modal").classList.remove("show");
$("copyReport").onclick=()=>{let t=reportText();if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert("Relatório copiado!"),()=>alert(t));else alert(t)};
$("newGameBtn").onclick=reset;
build("home");build("away");load();keys.forEach(k=>{$("home_"+k).textContent=count.home[k];$("away_"+k).textContent=count.away[k]});update();
function loop(now){if(running){acc(now);update()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
