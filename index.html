<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Análise de Jogo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#eef1f5;color:#15202b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#101820;color:#fff;padding:16px 12px 14px;text-align:center}
h1{font-size:21px;margin:0}.sub{font-size:12px;opacity:.7;margin:3px 0 8px}
#clock{font-size:42px;font-weight:900;font-variant-numeric:tabular-nums}
#status{font-size:13px;min-height:18px;color:#d9e0e7}
main{max-width:900px;margin:auto;padding:12px}
.card{background:#fff;border-radius:16px;padding:13px;margin-bottom:12px;box-shadow:0 2px 10px #0001}
.possession{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.posbox{text-align:center;background:#f5f7f9;border-radius:12px;padding:10px}
.pct{font-size:28px;font-weight:900}.time{font-size:12px;color:#687585}
.bigbuttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
button{border:0;border-radius:12px;font-weight:800;min-height:44px;font-size:14px}
.poshome{background:#159957;color:#fff}.posaway{background:#d64545;color:#fff}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.toolbar button{background:#e5e9ee;color:#17202a}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.title{text-align:center;font-size:17px;font-weight:900;margin-bottom:7px}
.stat{display:grid;grid-template-columns:1fr 52px;align-items:center;border-top:1px solid #edf0f2;padding:7px 0}
.stat:first-child{border-top:0}.name{font-size:13px}.plus{font-size:20px;background:#e9eef3}.count{text-align:center;grid-column:2;font-size:11px;color:#697586}
.report{line-height:1.7;font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:430px){.name{font-size:12px}.title{font-size:15px}}
</style>
</head>
<body>
<header>
<h1>⚽ ANÁLISE DE JOGO</h1>
<div class="sub">Ferramenta de análise • versão Web</div>
<div id="clock">00:00</div>
<div id="status">Cronómetro parado</div>
<div class="bigbuttons">
<button id="homePoss" class="poshome">🟢 NOSSA POSSE</button>
<button id="awayPoss" class="posaway">🔴 ADVERSÁRIO</button>
</div>
<div class="toolbar">
<button id="start">▶️ Iniciar / Parar</button>
<button id="newGame">↺ Novo jogo</button>
</div>
</header>
<main>
<section class="card">
<div class="possession">
<div class="posbox"><div>Nossa equipa</div><div id="homePct" class="pct">50.0%</div><div id="homeTime" class="time">00:00</div></div>
<div class="posbox"><div>Adversário</div><div id="awayPct" class="pct">50.0%</div><div id="awayTime" class="time">00:00</div></div>
</div>
</section>
<section class="stats">
<div class="card"><div class="title">🔵 NOSSA EQUIPA</div><div id="homeStats"></div></div>
<div class="card"><div class="title">🔴 ADVERSÁRIO</div><div id="awayStats"></div></div>
</section>
<section class="card"><div class="title">📊 Resumo</div><div id="report" class="report"></div></section>
<div class="actions">
<button id="copy">📋 Copiar relatório</button>
<button id="resetStats">↺ Zerar estatísticas</button>
</div>
</main>
<script>
(function(){
const labels=["🎯 Finalizações na baliza","❌ Finalizações fora","🚩 Cantos","⚠️ Faltas cometidas","🥅 Pontapés de baliza","↗️ Cruzamentos","🚩 Foras de jogo","🟨 Cartões amarelos","🟥 Cartões vermelhos"];
const keys=["shotsOn","shotsOff","corners","fouls","goalKicks","crosses","offsides","yellow","red"];
const count={home:{},away:{}};
keys.forEach(k=>{count.home[k]=0;count.away[k]=0});
let running=false,active=null,last=null,game=0,poss={home:0,away:0},n={home:0,away:0},max={home:0,away:0},possStart=null;

const $=id=>document.getElementById(id);
function fmt(x){x=Math.max(0,Math.floor(x));return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")}
function pct(t){let total=poss.home+poss.away;return total?(poss[t]/total*100).toFixed(1)+"%":"50.0%"}
function avg(t){return n[t]?fmt(poss[t]/n[t]):"00:00"}

function build(team){
 const box=$(team+"Stats");
 labels.forEach((label,i)=>{
  const key=keys[i], row=document.createElement("div"); row.className="stat";
  const name=document.createElement("div");name.className="name";name.textContent=label;
  const btn=document.createElement("button");btn.className="plus";btn.type="button";btn.textContent="+";
  const c=document.createElement("div");c.className="count";c.textContent="0";
  btn.onclick=()=>{count[team][key]++;c.textContent=count[team][key]};
  row.append(name,btn,c);box.appendChild(row);
 });
}
function update(){
 $("clock").textContent=fmt(game);$("homePct").textContent=pct("home");$("awayPct").textContent=pct("away");
 $("homeTime").textContent=fmt(poss.home);$("awayTime").textContent=fmt(poss.away);
 $("report").innerHTML="Posses: <b>"+n.home+"</b> / <b>"+n.away+"</b><br>Duração média: <b>"+avg("home")+"</b> / <b>"+avg("away")+"</b><br>Maior posse: <b>"+fmt(max.home)+"</b> / <b>"+fmt(max.away)+"</b>";
}
function accumulate(now){
 if(last===null){last=now;return}
 const d=(now-last)/1000;game+=d;if(active)poss[active]+=d;last=now;
}
function changePoss(team){
 const now=performance.now();
 if(!running){running=true;last=now}else accumulate(now);
 if(active && active!==team && possStart!==null){
  const d=(now-possStart)/1000;n[active]++;max[active]=Math.max(max[active],d);
 }
 if(active===null)n[team]++;
 active=team;possStart=now;
 $("status").textContent=team==="home"?"Posse: NOSSA EQUIPA":"Posse: ADVERSÁRIO";
 update();
}
function stop(){
 if(running)accumulate(performance.now());
 running=false;last=null;active=null;possStart=null;$("status").textContent="Cronómetro parado";update();
}
function reset(){
 running=false;active=null;last=null;possStart=null;game=0;poss={home:0,away:0};n={home:0,away:0};max={home:0,away:0};
 keys.forEach(k=>{count.home[k]=0;count.away[k]=0});
 document.querySelectorAll(".count").forEach(x=>x.textContent="0");
 $("status").textContent="Cronómetro parado";update();
}
$("homePoss").onclick=()=>changePoss("home");$("awayPoss").onclick=()=>changePoss("away");
$("start").onclick=()=>running?stop():(running=true,last=performance.now(),$("status").textContent="Jogo a decorrer");
$("newGame").onclick=reset;$("resetStats").onclick=()=>{keys.forEach(k=>{count.home[k]=0;count.away[k]=0});document.querySelectorAll(".count").forEach(x=>x.textContent="0")};
$("copy").onclick=()=>{let text="ANÁLISE DE JOGO\nPosse: "+pct("home")+" / "+pct("away")+"\nTempo: "+fmt(poss.home)+" / "+fmt(poss.away)+"\n";labels.forEach((l,i)=>text+=l+": "+count.home[keys[i]]+" / "+count.away[keys[i]]+"\n");navigator.clipboard?.writeText(text).then(()=>alert("Relatório copiado!"),()=>alert(text))};
build("home");build("away");update();
function loop(now){if(running){accumulate(now);update()}requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script>
</body>
</html>
